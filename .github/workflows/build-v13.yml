name: Build Ki-Kernel (Dev Branch)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device'
        required: true
        default: 'munch'
      variant:
        description: 'Variant (ksu, nosusfs, noksu)'
        required: true
        default: 'ksu'
      target_os:
        description: 'Target OS (miui, aosp, both)'
        required: true
        default: 'miui'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            crossbuild-essential-arm64 libarchive-tools zip unzip tar wget git curl python3 libzstd-dev

      - name: Setup ZyCromerZ Clang 16
        run: |
          mkdir -p $HOME/zyc-clang
          echo 'Downloading ZyCromerZ Clang 16...'
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o /tmp/zyc-clang.tar.gz
          tar -xzf /tmp/zyc-clang.tar.gz -C $HOME/zyc-clang/
          rm -f /tmp/zyc-clang.tar.gz

          mkdir -p $HOME/proton-clang
          ln -sfn $HOME/zyc-clang $HOME/proton-clang/proton-clang-20210522
          echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

      - name: Setup BakaSU & Bypass SuSFS Compat Stop
        run: |
          rm -rf KernelSU drivers/kernelsu
          
          echo 'Cloning BakaSU...'
          git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          
          # Bypass the strict susfs version stop check
          if [ -f KernelSU/kernel/tools/susfs_compat.mk ]; then
            sed -i 's/error/warning/g' KernelSU/kernel/tools/susfs_compat.mk
            sed -i '/Please wait susfs update/d' KernelSU/kernel/tools/susfs_compat.mk
          fi

          # Restore the expected symlink for Kbuild
          ln -sfn ../KernelSU/kernel drivers/kernelsu

          mkdir -p anykernel_template
          if [ -f anykernel.sh ]; then
            cp -f anykernel.sh anykernel_template/anykernel.sh
          fi

      - name: Setup NoMount
        run: |
          echo "--> Setup NoMount..."
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

      - name: Run Ki-Kernel Build Script
        run: |
          chmod +x build.sh
          bash build.sh ${{ github.event.inputs.target_device }} ${{ github.event.inputs.variant }} ${{ github.event.inputs.target_os }}

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ki-Kernel-DEV-${{ github.event.inputs.target_device }}-${{ github.event.inputs.target_os }}
          path: ./*.zip
